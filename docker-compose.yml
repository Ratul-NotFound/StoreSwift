version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storeswift_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://storeswift_user:storeswift_secret@postgres:5432/storeswift
      - NEXT_PUBLIC_ROOT_DOMAIN=storeswift.com
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - AUTH_SECRET=storeswift-production-cluster-secret-key-64bytes-minimum-security
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: storeswift_db
    restart: always
    environment:
      - POSTGRES_USER=storeswift_user
      - POSTGRES_PASSWORD=storeswift_secret
      - POSTGRES_DB=storeswift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeswift_user -d storeswift"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

