# ─────────────────────────────────────────────────────────────────────────────
# StoreSwift Upstream Cluster: Least-Connections Load Balancing
# ─────────────────────────────────────────────────────────────────────────────
upstream storeswift_cluster {
    # Distribute traffic based on active connection counts
    least_conn;

    # Backend Node.js / Next.js instances
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    server app3:3000 max_fails=3 fail_timeout=10s;

    # Keep 64 idle connections open to eliminate TCP handshake latency
    keepalive 64;
}

# In-memory proxy microcache for high-throughput public storefronts
proxy_cache_path /var/cache/nginx/storeswift levels=1:2 keys_zone=STORE_CACHE:20m max_size=500m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name localhost *.storeswift.app storeswift.com;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 1. Static Asset Acceleration (Bypass Node backend entirely) ───────────
    location /_next/static/ {
        proxy_pass http://storeswift_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache STORE_CACHE;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /images/ {
        proxy_pass http://storeswift_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache STORE_CACHE;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── 2. Health Check (Direct pass-through for load balancer probes) ─────────
    location = /api/health {
        proxy_pass http://storeswift_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        access_log off;
    }

    # ── 3. High-Concurrency Express Checkout Shield ───────────────────────────
    location = /api/orders {
        limit_req zone=checkout_limit burst=20 nodelay;
        limit_conn addr_limit 10;

        proxy_pass http://storeswift_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── 4. Main Application & Storefront Traffic ──────────────────────────────
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://storeswift_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR & live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts to prevent hanging worker threads
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # Inject upstream worker diagnostic header
        add_header X-Upstream-Server $upstream_addr always;
    }
}
