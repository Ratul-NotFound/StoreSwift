name: StoreSwift CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Vitest Test Suite
        run: npm test

      - name: Verify Production Next.js Build
        env:
          AUTH_SECRET: "ci-dummy-secret-key-that-is-at-least-32-chars-long"
          NEXT_PUBLIC_ROOT_DOMAIN: "storeswift.com"
          NEXT_PUBLIC_APP_URL: "https://storeswift.com"
        run: npm run build

